---
layout: default
---

<section class="hero">
  <h1>{{ page.heading | default: site.title }}</h1>
  <p class="hero-tagline">{{ page.subheading | default: site.tagline }}</p>
  <p>
    <a class="button" href="{{ page.cta_url | default: '/about/' | relative_url }}">{{ page.cta_text | default: "Learn more" }}</a>
  </p>
</section>

{% if page.features %}
<section class="features">
  {% for feature in page.features %}
  <article class="feature-card">
    <h2>{{ feature.title }}</h2>
    <p>{{ feature.body }}</p>
  </article>
  {% endfor %}
</section>
{% endif %}

<section class="content">
  {{ content }}
</section>
